name: Gateway policy tests
on:
  push:
    branches: ["staging/litellm-rp-gateway"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-policy-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-policy-tests.yml"
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: gateway
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        working-directory: gateway
        run: python -m py_compile rp_policy.py custom_callbacks.py
