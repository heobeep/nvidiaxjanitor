name: Gateway policy tests
on:
  push:
    branches: ["staging/litellm-rp-gateway"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-policy-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-policy-tests.yml"
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Parse LiteLLM config and assert critical settings
        working-directory: gateway
        run: |
          python - <<'PY'
          import yaml
          with open("proxy_config.yaml", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)
          assert cfg.get("model_list") == []
          assert cfg["litellm_settings"]["callbacks"] == "custom_callbacks.roleplay_hook"
          assert cfg["general_settings"]["master_key"] == "os.environ/LITELLM_MASTER_KEY"
          assert cfg["general_settings"]["database_url"] == "os.environ/DATABASE_URL"
          assert cfg["router_settings"]["num_retries"] == 2
          print("LiteLLM config YAML parsed; critical staging settings look correct.")
          PY
      - name: Unit tests
        working-directory: gateway
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        working-directory: gateway
        run: python -m py_compile rp_policy.py custom_callbacks.py
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0
      - name: Verify pinned LiteLLM image signature
        run: |
          cosign verify \
            --key https://raw.githubusercontent.com/BerriAI/litellm/e82a3c646908ba0a6ee0beddc4310d7a6cac4065/cosign.pub \
            ghcr.io/berriai/litellm:v1.106.4
