# LiteLLM Gateway config. Models and provider credentials are managed in /ui and
# stored in PostgreSQL, allowing credentials to be rotated without editing Git.
model_list: []

litellm_settings:
  callbacks: custom_callbacks.roleplay_hook

router_settings:
  num_retries: 2
  allowed_fails: 1
  # Cool a rate-limited/failing deployment temporarily so another key can serve.
  # This is a cooldown, not permanent quota detection; see gateway/README.md.
  cooldown_time: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
